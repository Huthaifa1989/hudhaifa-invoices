<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>فواتير حذيفة</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg1:#6a11cb;      /* بنفسجي */
      --bg2:#2575fc;      /* أزرق */
      --card-bg: rgba(255,255,255,.14);
      --card-stroke: rgba(255,255,255,.35);
      --ink:#0b1324;
      --muted:#5b6b7a;
      --ring:#dde5ee;
      --shadow: 0 10px 40px rgba(0,0,0,.18);
    }
    @media (prefers-color-scheme: dark){
      :root{
        --card-bg: rgba(18,22,33,.35);
        --card-stroke: rgba(255,255,255,.18);
        --ink:#eaf0ff;
        --muted:#b4bfd0;
        --ring:#343c4a;
        --shadow: 0 12px 50px rgba(0,0,0,.45);
      }
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:'Cairo', system-ui, -apple-system, Segoe UI, Tahoma, Arial, sans-serif;
      color:var(--ink);
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(1200px 800px at 10% -10%, rgba(255,255,255,.25), transparent 60%),
        radial-gradient(900px 700px at 110% 10%, rgba(255,255,255,.22), transparent 60%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow:hidden;
    }

    /* خلفية فقاعات خفيفة */
    .bubbles{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;}
    .bubble{
      position:absolute; bottom:-160px; border-radius:50%;
      background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.9) 0 16%, rgba(255,255,255,.25) 17% 40%, rgba(255,255,255,0) 41% 100%);
      filter:blur(var(--blur,0px)); opacity:.5; width:var(--s); height:var(--s); left:var(--x);
      animation: rise var(--t,22s) linear infinite; animation-delay: var(--d, 0s);
    }
    @keyframes rise {
      0%{ transform:translateY(0) scale(1); opacity:0; }
      10%{ opacity:.55; }
      90%{ opacity:.55; }
      100%{ transform:translateY(-120vh) translateX(var(--dx,0px)) scale(1.06); opacity:0; }
    }
    @media (prefers-reduced-motion: reduce){
      .bubble{ display:none; }
      *{ animation:none !important; transition:none !important; }
    }

    /* البطاقة الرئيسية */
    .container{
      position:relative; z-index:1;
      width:min(900px, 95%);
      padding:28px 24px 22px;
      border-radius:26px;
      background:var(--card-bg);
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      box-shadow: var(--shadow);
      outline:1px solid var(--card-stroke);
    }

    /* رأس البطاقة */
    .brand{
      display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:4px;
      color:#fff;
      text-shadow: 0 4px 16px rgba(0,0,0,.25);
    }
    .brand .emoji{ font-size:44px; filter: drop-shadow(0 3px 10px rgba(0,0,0,.25)); }
    .brand h1{ margin:0; font-weight:900; letter-spacing:.5px; font-size:28px; }
    .subtitle{ text-align:center; color:#eef4ff; opacity:.9; margin:8px 0 20px; font-weight:700; }

    /* شبكة الأزرار */
    .grid{
      display:grid; gap:14px;
      grid-template-columns: repeat(2, minmax(0,1fr));
    }
    @media (max-width:650px){ .grid{ grid-template-columns: 1fr; } }

    .btn{
      position:relative; overflow:hidden;
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      width:100%; padding:18px 18px;
      border-radius:16px; border:1px solid rgba(255,255,255,.22);
      cursor:pointer; font-weight:900; font-size:1.05rem; letter-spacing:.3px;
      color:#fff; text-align:start; text-decoration:none;
      transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,.12);
      outline: none;
    }
    .btn:focus-visible{ box-shadow: 0 0 0 3px #fff7, 0 8px 26px rgba(0,0,0,.18); }

    .btn .label{ display:flex; align-items:center; gap:10px; }
    .btn .label .ico{ font-size:22px }
    .btn .arrow{ font-size:18px; opacity:.95 }

    .btn:hover{ transform: translateY(-3px); box-shadow: 0 14px 34px rgba(0,0,0,.18); opacity:.96; }

    /* تدرجات لكل خدمة */
    .wolt{     background:linear-gradient(135deg,#0ea5e9,#0369a1); }
    .gas{      background:linear-gradient(135deg,#16a34a,#0d9488); }
    .electric{ background:linear-gradient(135deg,#f59e0b,#ef4444); }
    .water{    background:linear-gradient(135deg,#22c1c3,#1d4ed8); }
    .arnona{   background:linear-gradient(135deg,#8b5cf6,#6b7280); }
    .other{    background:linear-gradient(135deg,#4b5563,#111827); }

    /* شريط سفلي بسيط */
    .footer{
      margin-top:16px; padding-top:10px;
      color:#e7eeff; text-align:center; font-weight:700; font-size:.95rem;
      border-top:1px dashed rgba(255,255,255,.28);
    }

    /* شارة الحالة */
    .status{ display:inline-flex; align-items:center; gap:8px; font-size:.88rem; color:#eaf1ff; }
    .dot{ width:8px; height:8px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 4px rgba(34,197,94,.15); }

    /* موجة زخرفية أعلى البطاقة */
    .wave{
      position:absolute; inset-inline:0; top:-70px; height:140px; z-index:0; pointer-events:none; opacity:.35;
      background:
        radial-gradient(800px 120px at 50% 100%, rgba(255,255,255,.55), transparent 70%);
      filter: blur(6px);
    }
  </style>
</head>
<body>

  <!-- فقاعات الخلفية -->
  <div class="bubbles" aria-hidden="true">
    <span class="bubble" style="--s:120px;--x:8%; --t:26s;--d:-4s; --dx:-30px; --blur:1px;"></span>
    <span class="bubble" style="--s:80px; --x:22%;--t:18s;--d:-10s;--dx:20px;"></span>
    <span class="bubble" style="--s:60px; --x:35%;--t:16s;--d:-6s; --dx:-15px;"></span>
    <span class="bubble" style="--s:140px;--x:48%;--t:28s;--d:-8s; --dx:35px; --blur:2px;"></span>
    <span class="bubble" style="--s:70px; --x:62%;--t:17s;--d:-3s;  --dx:-25px;"></span>
    <span class="bubble" style="--s:95px; --x:74%;--t:21s;--d:-12s; --dx:18px;"></span>
    <span class="bubble" style="--s:52px; --x:86%;--t:15s;--d:-5s;  --dx:-18px;"></span>
  </div>

  <div class="container" role="main" aria-labelledby="title">
    <div class="wave" aria-hidden="true"></div>

    <div class="brand">
      <span class="emoji" aria-hidden="true">🧾</span>
      <h1 id="title">فواتير حذيفة</h1>
    </div>
    <p class="subtitle">كل فواتيرك في مكان واحد — واجهة سريعة، أنيقة، وواضحة</p>

    <div class="grid" role="navigation">
      <a class="btn wolt" href="/wolt.html">
        <span class="label"><span class="ico" aria-hidden="true">🚚</span>Wolt</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="btn gas" href="/gas.html">
        <span class="label"><span class="ico" aria-hidden="true">⛽</span>فواتير البنزين</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="btn electric" href="/electric.html">
        <span class="label"><span class="ico" aria-hidden="true">⚡</span>الكهرباء</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="btn water" href="/water.html">
        <span class="label"><span class="ico" aria-hidden="true">💧</span>الماء</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="btn arnona" href="/arnona.html">
        <span class="label"><span class="ico" aria-hidden="true">🏠</span>الأرنونا</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="btn other" href="/other.html">
        <span class="label"><span class="ico" aria-hidden="true">📄</span>فواتير أخرى</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </div>

    <div class="footer">
      <span class="status"><span class="dot" id="status-dot"></span><span id="status-text">النظام يعمل</span></span>
      <div style="margin-top:6px">🚀 مشروع فواتير حذيفة — جميع الحقوق محفوظة 2025</div>
    </div>
  </div>

  <script>
    // فحص حالة الـ API بشكل خفيف (اختياري)
    (async () => {
      try {
        const r = await fetch('/api', { cache: 'no-store' });
        if (!r.ok) throw 0;
        const d = await r.json();
        document.getElementById('status-text').textContent = d.message ? 'النظام يعمل' : 'متصل';
      } catch {
        document.getElementById('status-text').textContent = 'انقطاع مؤقت في الخادم';
        const dot = document.getElementById('status-dot');
        dot.style.background = '#ef4444';
        dot.style.boxShadow = '0 0 0 4px rgba(239,68,68,.15)';
      }
    })();
  </script>
</body>
</html>
