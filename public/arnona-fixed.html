<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>فواتير الأرنونا - Fixed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#0b2130;
      --ring:#e5e7eb;
      --card:#ffffff;
      --accent:#7c3aed;
      --title:#6b21a8;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:'Cairo',sans-serif; min-height:100vh; display:flex; flex-direction:column;
      background: radial-gradient(1200px 800px at 20% -10%, #f2e9ff 0%, #f6f0ff 40%, #fbf8ff 70%, #ffffff 100%);
      color:var(--ink);
    }
    header{ text-align:center; padding:18px 12px 8px; }
    header h2{ margin:0; font-weight:900; font-size:22px; color:var(--title); }
    header .sub{ margin-top:4px; color:#5b5566; font-weight:700; font-size:14px; }
    .home-link{
      display:inline-block; margin-bottom:8px; padding:6px 14px; font-weight:700; border-radius:10px;
      border:1px solid var(--accent); color:#fff; background:var(--accent); text-decoration:none;
    }
    .container{
      width:min(960px,96%); margin:0 auto 18px; background:var(--card);
      border:1px solid var(--ring); border-radius:20px; box-shadow:0 8px 24px rgba(0,0,0,.1); padding:20px;
    }
    h1{ margin:0 0 12px; text-align:center; color:#1e1b4b; font-weight:900; font-size:20px; }
    .invoice{ background:#f8fafc; border:1px solid #e5e7eb; border-radius:14px; padding:14px; margin:12px 0; }
    .invoice-title{ font-weight:900; color:#3b2d5a; margin-bottom:4px; word-break:break-word; }
    .invoice-det{ font-size:.95rem; line-height:1.7; }
    .actions{ margin-top:10px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .btn{ border:1px solid #cfd8dc; background:#fff; border-radius:12px; padding:9px 14px; cursor:pointer; font-weight:800; transition:.15s; }
    .btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
    .no{ color:#b22222; font-weight:900; text-align:center; padding:18px 0; }
    .error{ color:#b22222; font-weight:800; }
    .loading{ color:#007bff; font-weight:800; text-align:center; padding:18px 0; }
    .status{ background:#e8f5e8; border:1px solid #4caf50; padding:10px; border-radius:5px; margin:10px 0; }
    .skyline{ margin-top:auto; width:100%; height:140px; background:#fff url('arnona-skyline.png') no-repeat center bottom; background-size:contain; }

    @media (max-width:700px){
      .container{ padding:16px 10px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="home-link">الصفحة الرئيسية</a>
    <h2>بلدية القدس – الأرنونا</h2>
    <div class="sub">عرض فواتير الأرنونا ومرفقاتها من البريد</div>
  </header>

  <div class="container">
    <h1>فواتير الأرنونا</h1>
    
    <div id="status" class="status" style="display:none;"></div>
    <div id="invoices">
      <div class="loading">جاري تحميل الفواتير...</div>
    </div>
  </div>

  <div class="skyline" aria-hidden="true"></div>

  <script>
    // ===== إعدادات عامة
    const TZ = 'Asia/Jerusalem', LOCALE = 'ar-PS';

    function formatDateSmart(inv){
      const cand = inv.dateIso || inv.date || inv.dateRaw || '';
      if(!cand) return '-';
      let d = new Date(cand);
      if(isNaN(d)) { try{ d = new Date(Date.parse(cand)); }catch{} }
      if(isNaN(d)) return inv.date || cand;
      try{
        return new Intl.DateTimeFormat(LOCALE,{
          timeZone:TZ, weekday:'long', year:'numeric', month:'long', day:'numeric',
          hour:'2-digit', minute:'2-digit'
        }).format(d);
      }catch{ return d.toLocaleString('ar', { timeZone: TZ }); }
    }

    function showStatus(message, type = 'info') {
      const statusDiv = document.getElementById('status');
      statusDiv.style.display = 'block';
      statusDiv.innerHTML = message;
      statusDiv.className = `status ${type}`;
    }

    function renderArnonaInvoices(invoices){
      const root = document.getElementById('invoices');
      root.innerHTML = '';
      
      if(!invoices || !invoices.length){
        root.innerHTML = '<div class="no">لا توجد مستندات حالياً.</div>';
        return;
      }

      showStatus(`تم تحميل ${invoices.length} فواتير أرنونا`, 'success');

      invoices.forEach(inv => {
        const card = document.createElement('div');
        card.className = 'invoice';

        const title = document.createElement('div');
        title.className = 'invoice-title';
        title.textContent = inv.subject || 'مستند أرنونا';
        card.appendChild(title);

        const det = document.createElement('div');
        det.className = 'invoice-det';
        det.innerHTML = `
          <b>التاريخ:</b> ${formatDateSmart(inv)}<br>
          <b>المرسل:</b> ${inv.from || '-'}<br>
          <b>مختصر:</b> ${(inv.snippet || '').substring(0, 100)}...
        `;
        card.appendChild(det);

        const actions = document.createElement('div');
        actions.className = 'actions';
        
        const viewBtn = document.createElement('button');
        viewBtn.className = 'btn primary';
        viewBtn.textContent = 'عرض التفاصيل';
        viewBtn.onclick = () => {
          alert(`تفاصيل الفاتورة:\n\nالموضوع: ${inv.subject}\nالمرسل: ${inv.from}\nالتاريخ: ${formatDateSmart(inv)}\n\n${inv.snippet}`);
        };
        actions.appendChild(viewBtn);

        card.appendChild(actions);
        root.appendChild(card);
      });
    }

    async function loadArnonaInvoices(){
      try{
        showStatus('جاري تحميل الفواتير...', 'loading');
        
        const response = await fetch('/api/invoices/arnona?refresh=0');
        if(!response.ok) {
          throw new Error('HTTP ' + response.status);
        }
        
        const data = await response.json();
        console.log('API Response:', data);
        
        if(data && data.invoices) {
          renderArnonaInvoices(data.invoices);
        } else {
          throw new Error('No invoices data in response');
        }
      } catch(error) {
        console.error('Error fetching invoices:', error);
        showStatus(`خطأ في تحميل الفواتير: ${error.message}`, 'error');
        document.getElementById('invoices').innerHTML = '<div class="no">تعذّر جلب البيانات.</div>';
      }
    }

    // Load invoices when page loads
    window.onload = function() {
      loadArnonaInvoices();
    };

    // Refresh every 30 seconds
    setInterval(loadArnonaInvoices, 30000);
  </script>
</body>
</html>
