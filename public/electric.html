<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>فواتير الكهرباء</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      background: linear-gradient(to bottom right, #f0f8ff, #e6f0ff, #ffffff);
      display: flex;
      flex-direction: column;
    }
    header {
      text-align: center;
      padding: 16px 12px 8px;
    }
    .home-link {
      display:inline-block;
      margin-bottom:10px;
      padding:6px 14px;
      font-weight:700;
      border-radius:10px;
      border:1px solid #ff9800;
      color:#fff;
      background:#ff9800;
      text-decoration:none;
    }
    header img {
      max-height: 90px;
      display: block;
      margin: 0 auto 6px;
      background: transparent !important; /* شعار PNG شفاف */
    }
    header h2 {
      margin: 0;
      font-weight: 900;
      font-size: 22px;
      color: #e65100;
    }
    .container {
      flex: 1;
      width: min(960px, 96%);
      margin: 0 auto 18px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,.1);
      padding: 20px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 20px;
      font-weight: 900;
      color: #0b2130;
      text-align: center;
    }
    .invoice { background:#f8fafc; border:1px solid #e5e7eb; border-radius:14px; padding:14px; margin:12px 0; }
    .invoice-title{font-weight:900;color:#e65100;margin-bottom:4px}
    .invoice-det{color:#334155;font-size:.95rem;line-height:1.7}
    .actions{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap}
    .btn{border:1px solid #cfd8dc;background:#fff;border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:800}
    .btn.primary{background:#ff9800;color:#fff;border-color:#ff9800}
    .no{color:#b22222;font-weight:900;text-align:center;padding:18px 0}

    /* Modal */
    #pdfModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999}
    #pdfModal .box{background:#fff;width:96%;max-width:980px;height:90vh;margin:3vh auto;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
    #pdfModal .head{padding:12px 16px;border-bottom:1px solid #eef1f4;display:flex;justify-content:space-between;align-items:center}
    #pdfTitle{color:#082230} #pdfLoading{padding:12px;color:#082230} #pdfFrame{border:0;width:100%;flex:1;display:none}
    #toolbar{padding:10px;border-top:1px solid #eef1f4;display:flex;gap:10px;background:#fafafa}
    .hidden{display:none!important}
  </style>
</head>
<body>
  <header>
    <a href="/" class="home-link">الصفحة الرئيسية</a>
    <img src="jdeco-logo.png" alt="شعار شركة الكهرباء" />
    <h2>شركة كهرباء محافظة القدس</h2>
  </header>

  <div class="container">
    <h1>فواتير الكهرباء</h1>
    <div id="invoices"></div>
  </div>

  <!-- Modal للمعاينة على الديسكتوب -->
  <div id="pdfModal">
    <div class="box">
      <div class="head">
        <strong id="pdfTitle">معاينة الفاتورة</strong>
        <button id="closePdfBtn" class="btn">إغلاق</button>
      </div>
      <div id="pdfLoading">جارِ التحميل…</div>
      <iframe id="pdfFrame" title="PDF Preview"></iframe>
      <div id="toolbar">
        <a id="downloadBtn" class="btn hidden" href="#" download>تحميل</a>
        <button id="printBtn" class="btn hidden">طباعة</button>
      </div>
    </div>
  </div>

  <script>
    // ===== إعدادات عامة
    const IS_MOBILE = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
    const TZ = 'Asia/Jerusalem';
    const LOCALE = 'ar-PS';

    // تاريخ محلي احتياطي (لو ما وصلنا dateLocal من الخادم)
    function formatEmailDate(raw) {
      if (!raw) return '-';
      let d = new Date(raw);
      if (isNaN(d)) { try { d = new Date(Date.parse(raw)); } catch {} }
      if (isNaN(d)) return raw;
      try {
        return new Intl.DateTimeFormat(LOCALE, {
          timeZone: TZ,
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        }).format(d);
      } catch {
        return d.toLocaleString('ar', { timeZone: TZ });
      }
    }

    // ===== مودال المعاينة (ديسكتوب)
    const M={blob:null,name:null};
    function closeModal(){
      document.getElementById('pdfFrame').src='about:blank';
      document.getElementById('pdfModal').style.display='none';
      if(M.blob){URL.revokeObjectURL(M.blob);M.blob=null;}
    }
    document.getElementById('closePdfBtn').onclick=closeModal;

    async function openInline(inlineUrl,filename){
      // موبايل: افتح مباشرة من الباكند في تبويب جديد (بدون Google Drive)
      if (IS_MOBILE) {
        window.open(inlineUrl, '_blank');
        return;
      }
      // ديسكتوب: مودال + Blob
      const modal=document.getElementById('pdfModal');
      const frame=document.getElementById('pdfFrame');
      const loading=document.getElementById('pdfLoading');
      const dl=document.getElementById('downloadBtn');
      const pr=document.getElementById('printBtn');

      dl.classList.add('hidden'); pr.classList.add('hidden');
      frame.style.display='none'; loading.style.display='block';

      const res=await fetch(inlineUrl, { cache:'no-store' });
      const buf=await res.arrayBuffer();
      if(M.blob) URL.revokeObjectURL(M.blob);
      M.blob=URL.createObjectURL(new Blob([buf],{type:'application/pdf'}));
      M.name=filename||'invoice.pdf';

      frame.onload=()=>{loading.style.display='none';frame.style.display='block';dl.classList.remove('hidden');pr.classList.remove('hidden');};
      frame.src=M.blob + '#toolbar=1&navpanes=0&view=fitH';

      dl.href=inlineUrl; dl.setAttribute('download', M.name);
      pr.onclick=()=>{const w=window.open(M.blob,'_blank');setTimeout(()=>{try{w.print();}catch{}},500);};

      modal.style.display='flex';
    }

    // ===== Utilities
    async function fetchJSON(u){
      const r=await fetch(u, { cache: 'no-store' });
      if(!r.ok) throw new Error(r.status);
      return r.json();
    }
    async function fetchAttachments(id){
      const d=await fetchJSON(`/gmail/messages/${id}/attachments`);
      return d.attachments||[];
    }

    // ===== Render
    function render(list){
      const root=document.getElementById('invoices'); root.innerHTML='';
      if(!list.length){
        root.innerHTML='<div class="no">لا توجد فواتير حالياً.</div>';
        return;
      }
      list.forEach(inv=>{
        // نستخدم dateLocal من الخادم إن وجد، وإلا نحاول تحويل أي من الحقول المتاحة
        const niceDate = inv.dateLocal || formatEmailDate(inv.dateIso || inv.dateRaw || inv.date);
        const card=document.createElement('div'); card.className='invoice';
        card.innerHTML=`
          <div class="invoice-title">${inv.subject||'فاتورة كهرباء'}</div>
          <div class="invoice-det">
            <b>التاريخ:</b> ${niceDate}<br>
            <b>المرسل:</b> ${inv.from||'-'}<br>
            <b>مختصر:</b> ${inv.snippet||''}
          </div>
        `;
        const btn=document.createElement('button'); btn.className='btn primary'; btn.textContent='عرض المرفقات';
        btn.onclick=async()=>{
          // Since we're using cached data without attachments, show a simple message
          alert(`تفاصيل الفاتورة:\n\nالموضوع: ${inv.subject || 'فاتورة كهرباء'}\n\nمعرف الرسالة: ${inv.id}\n\nالبيانات من الذاكرة المؤقتة - المرفقات غير متوفرة حالياً`);
        };
        const actions=document.createElement('div'); actions.className='actions'; actions.appendChild(btn);
        card.appendChild(actions); root.appendChild(card);
      });
    }

    // ===== Load
    async function load(){
      try{
        const d=await fetchJSON('/api/invoices/cached');
        // Extract electric invoices from the cached data
        const electricData = d && d.data && d.data.electric;
        if (electricData && electricData.data) {
          render(electricData.data);
        } else {
          render([]);
        }
      }catch{
        document.getElementById('invoices').innerHTML='<div class="no">تعذر جلب البيانات.</div>';
      }
    }
    load();
    setInterval(load, 60000); // تحديث كل دقيقة
  </script>
</body>
</html>
