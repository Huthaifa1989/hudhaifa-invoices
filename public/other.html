<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <title>فواتير أخرى</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { background: linear-gradient(135deg, #636e72 0%, #764ba2 100%); font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; }
    .container { background: rgba(255,255,255,0.97); padding: 40px 24px 28px 24px; border-radius: 20px; box-shadow: 0 12px 40px rgba(76, 51, 133, 0.13); max-width: 600px; width: 98%; text-align: center; position: relative; backdrop-filter: blur(6px); }
    h1 { color: #636e72; margin-bottom: 18px; font-size: 2em; font-weight: 900; letter-spacing: 1px; }
    .back { position: absolute; top: 18px; left: 18px; background: #636e72; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 1em; cursor: pointer; transition: 0.2s; }
    .back:hover { background: #222f3e; }
    .uploaded-list { margin-top: 18px; text-align: right; }
    .uploaded-item { background: #fff; border-radius: 8px; padding: 10px; margin-bottom: 10px; border: 1px solid #e9ecef; color: #2d3748; font-size: 1em; }
    .no-files { color: #e74c3c; font-weight: bold; margin-top: 20px; text-align: center; }
    .upload-form { background: #f8f9fa; border-radius: 10px; padding: 18px; margin-bottom: 18px; border: 1px solid #e9ecef; text-align: right; }
    .upload-form input, .upload-form textarea { width: 98%; margin-bottom: 10px; padding: 7px; border-radius: 6px; border: 1px solid #b2bec3; font-size: 1em; }
    .upload-form label { font-weight: bold; color: #636e72; }
    .upload-form button { background: #636e72; color: #fff; border: none; border-radius: 7px; padding: 7px 18px; font-size: 1em; cursor: pointer; transition: 0.2s; }
    .upload-form button:hover { background: #222f3e; }
    @media (max-width: 700px) { .container { padding: 18px 4px 12px 4px; } h1 { font-size: 1.2em; } }
  </style>
</head>
<body>
  <div class="container">
    <button class="back" onclick="window.location.href='/'">الصفحة الرئيسية</button>
    <h1>فواتير أخرى</h1>
    <form class="upload-form" id="manualInvoiceForm">
      <label>اسم الفاتورة:</label>
      <input type="text" name="name" required placeholder="اسم الفاتورة">
      <label>رابط الفاتورة (صورة أو PDF أو أي ملف):</label>
      <input type="url" name="url" placeholder="https://example.com/file.pdf">
      <label>ملاحظة (اختياري):</label>
      <textarea name="note" rows="2" placeholder="ملاحظة إضافية"></textarea>
      <button type="submit">رفع الفاتورة</button>
    </form>
    <div id="uploadedFiles" class="uploaded-list"></div>
  </div>
  <script>
    function showUploadedFiles(files) {
      const div = document.getElementById('uploadedFiles');
      if (!files.length) {
        div.innerHTML = '<div class="no-files">لا توجد فواتير مرفوعة حالياً.</div>';
        return;
      }
      div.innerHTML = '';
      files.forEach(file => {
        div.innerHTML += `
          <div class="uploaded-item">
            <b>اسم الفاتورة:</b> ${file.name}<br>
            ${file.url ? `<a href="${file.url}" target="_blank">عرض / تحميل</a>` : ''}
            ${file.note ? `<div><b>ملاحظة:</b> ${file.note}</div>` : ''}
          </div>
        `;
      });
    }

    function fetchManualInvoices() {
      fetch('/api/upload')
        .then(res => res.json())
        .then(data => {
          showUploadedFiles(data.files || []);
        })
        .catch(() => {
          document.getElementById('uploadedFiles').innerHTML = '<div class="no-files">تعذر جلب الفواتير.</div>';
        });
    }

    document.getElementById('manualInvoiceForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const form = e.target;
      const invoice = {
        name: form.name.value.trim(),
        url: form.url.value.trim(),
        note: form.note.value.trim()
      };
      if (!invoice.name) return alert('يرجى إدخال اسم الفاتورة');
      fetch('/api/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(invoice)
      })
      .then(res => res.json())
      .then(data => {
        form.reset();
        fetchManualInvoices();
      })
      .catch(() => alert('تعذر رفع الفاتورة'));
    });

    fetchManualInvoices();
    setInterval(fetchManualInvoices, 60000);
  </script>
</body>
</html>
